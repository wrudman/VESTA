[project]
name = "pymc_model_selection"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 360
markers = [
    "integration: end-to-end tests that exercise multiple components together",
]

[tool.ruff]
line-length = 110
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E731", "E741"]
